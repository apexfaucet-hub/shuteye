<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shuteye · talk to Claude Code</title>
<style>
  :root { --bg:#F7F2E7; --ink:#3b2d0c; --soft:#6F5725; --line:#D2BD8A; --card:#FFFCF5; --gold1:#F1DB93; --gold2:#D4AF37; --btn-ink:#3A2A06; --bad:#9B1C1C; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B0A0B; --ink:#f3d6d8; --soft:#C9B6B8; --line:#4A3A3D; --card:#17131A; --bad:#FF8A8A; } }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .soft { color:var(--soft); font-size:15px; margin:0 0 18px; }
  #talk { display:block; width:100%; min-height:38vh; border-radius:28px; border:2px solid #A67F22; font-size:30px; font-weight:800;
          background:linear-gradient(180deg,var(--gold1),var(--gold2)); color:var(--btn-ink); cursor:pointer; }
  #talk.listening { background:#1E6B34; color:#fff; border-color:#1E6B34; }
  #talk.working { background:#5B4411; color:#fff; border-color:#5B4411; }
  #talk.speaking { background:#27496D; color:#fff; border-color:#27496D; }
  .row { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  .row button { flex:1; min-width:140px; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:17px; font-weight:700; }
  .row button.on { border:2px solid #1E6B34; }
  .row select { flex:2; min-width:180px; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:16px; }
  details#settings { margin:4px 0 16px; border:1px solid var(--line); border-radius:14px; padding:10px 14px; background:var(--card); }
  details#settings summary { font-weight:700; cursor:pointer; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .grid label { font-size:14px; color:var(--soft); display:flex; flex-direction:column; gap:4px; }
  .grid select { padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
  #status { font-size:17px; margin:6px 0 14px; min-height:1.5em; }
  .bad { color:var(--bad); }
  #log { border-top:1px solid var(--line); padding-top:8px; }
  .turn { padding:10px 0; border-bottom:1px solid var(--line); }
  .turn b { display:block; font-size:13px; color:var(--soft); text-transform:uppercase; letter-spacing:1px; }
  #keybox { display:none; padding:14px; border:2px dashed #B8912F; border-radius:14px; margin-bottom:14px; }
  #keybox input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Talk to Claude Code</h1>
  <p class="soft">Tap, speak, and the answer is read out loud. Mode: <b>__MODE__</b>.</p>
  <div id="keybox"><p>This phone is not connected yet. Open a pairing link from your computer (run <code>node server.js --pair</code>), or paste the key here:</p><input id="keyin" autocomplete="off" placeholder="key"></div>
  <button id="talk">Tap to talk</button>
  <div id="status"></div>
  <div class="row">
    <button id="hands">Hands-free: off</button>
    <button id="stop">Stop</button>
    <button id="topic">New topic</button>
  </div>
  <div class="row">
    <select id="voice" aria-label="Voice"></select>
    <button id="test">Test voice</button>
    <button id="repeat">Repeat</button>
  </div>
  <details id="settings">
    <summary>Settings</summary>
    <div class="grid">
      <label>Model<select id="model"><option value="">Your default</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="fable">Fable</option><option value="haiku">Haiku</option></select></label>
      <label>Effort<select id="effort"><option value="">Your default</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="xhigh">Extra high</option><option value="max">Max</option></select></label>
      <label>Speaking speed<select id="rate"><option value="0.85">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option><option value="1.5">Very fast</option></select></label>
      <label>Answers<select id="detail"><option value="">Short</option><option value="1">Detailed</option></select></label>
    </div>
  </details>
  <div id="log"></div>
  <p class="soft" style="margin-top:28px">Open source: <a href="https://github.com/apexfaucet-hub/shuteye" style="color:inherit">Shuteye</a>, made by <a href="https://apexfaucet.xyz/arc/" style="color:inherit">APEX Faucet on Arc</a>.</p>
</main>
<script>
(function () {
  var K = 'shuteye-key', key = '', BASE = '__BASE__';
  try {
    key = localStorage.getItem(K) || '';
    // A one-time pairing link (#p=...) is traded for the key once; the key itself never travels in a link.
    var pt = new URLSearchParams(location.hash.replace(/^#/, '')).get('p');
    if (pt) {
      history.replaceState(null, '', location.pathname);
      fetch(BASE + '/api/pair', { method: 'POST', headers: { 'X-Pair-Token': pt } }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.ok && j.key) { key = j.key; localStorage.setItem(K, key); document.getElementById('keybox').style.display = 'none'; document.getElementById('status').textContent = 'This phone is connected.'; }
        else { document.getElementById('status').textContent = j.error || 'Pairing failed.'; }
      });
    }
  } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var talk = $('talk'), status = $('status'), log = $('log'), handsBtn = $('hands');
  var hands = false, busy = false, rec = null, job = null, tick = null, wake = null, netTries = 0;
  try { hands = localStorage.getItem('shuteye-hands') === '1'; } catch (e) {}
  handsBtn.textContent = 'Hands-free: ' + (hands ? 'on' : 'off'); handsBtn.classList.toggle('on', hands);
  if (!key) { $('keybox').style.display = 'block'; }
  $('keyin').addEventListener('change', function () { key = this.value.trim(); try { localStorage.setItem(K, key); } catch (e) {} $('keybox').style.display = 'none'; });

  function say(t, cls) { status.textContent = t; status.className = cls || ''; }
  function addTurn(who, text) { var d = document.createElement('div'); d.className = 'turn'; var b = document.createElement('b'); b.textContent = who; d.appendChild(b); d.appendChild(document.createTextNode(text)); log.insertBefore(d, log.firstChild); }
  function mode(m) { talk.className = m || ''; talk.textContent = m === 'listening' ? 'Listening…' : m === 'working' ? 'Thinking…' : m === 'speaking' ? 'Speaking… tap to stop' : 'Tap to talk'; }
  function api(method, url, body) {
    return fetch(BASE + '/api/' + url, { method: method, headers: { 'Content-Type': 'application/json', 'X-Voice-Key': key }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { j._code = r.status; return j; }); });
  }
  // A soft tone every 8 seconds while it is thinking, so you know it is alive with your eyes closed.
  var actx = null;
  function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 440; g.gain.value = 0.04; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.12); } catch (e) {} }
  function keepAwake() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }); } catch (e) {} }

  // Voice picker: every voice the phone offers for your language; the choice is remembered on this device.
  // First time, a male-sounding voice is preferred when the phone has one (Claude's app voice is male by default).
  var voices = [], chosen = null, VK = 'shuteye-voice', sel = $('voice');
  var MALE = /\b(male|man|guy|daniel|david|george|james|ryan|brian|fred|alex|thomas|oliver)\b|x-(iom|iol|tpd|rjs|gbd|gbb|fis)/i;
  // Chrome on Android lists one entry per accent, does not say male or female, and speaks with the phone's own
  // text-to-speech voice whatever the page picks (seen on a real phone, 2026-09-26). So on Android the picker is replaced by
  // a pointer to the phone setting that really changes the voice.
  var ANDROID = /Android/i.test(navigator.userAgent);
  if (ANDROID) { var hint = document.createElement('p'); hint.className = 'soft'; hint.style.margin = '-4px 2px 14px'; hint.style.textAlign = 'center';
    hint.textContent = 'The voice comes from your phone: Settings, then Text-to-speech.';
    var row = sel.parentNode; row.parentNode.insertBefore(hint, row.nextSibling); sel.style.display = 'none'; }
  function loadVoices() {
    if (ANDROID) return;
    if (!('speechSynthesis' in window)) { sel.style.display = 'none'; return; }
    var all = speechSynthesis.getVoices(); if (!all.length) return;
    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    voices = all.filter(function (v) { return String(v.lang).toLowerCase().indexOf(lang) === 0; }); if (!voices.length) voices = all;
    var saved = ''; try { saved = localStorage.getItem(VK) || ''; } catch (e) {}
    chosen = voices.filter(function (v) { return v.name === saved; })[0] || voices.filter(function (v) { return MALE.test(v.name + ' ' + v.voiceURI); })[0] || voices[0];
    sel.innerHTML = '';
    voices.forEach(function (v, i) { var o = document.createElement('option'); o.value = i; o.textContent = v.name.replace(/^(Google|Microsoft)\s+/, '') + ' (' + v.lang + ')'; if (v === chosen) o.selected = true; sel.appendChild(o); });
  }
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  sel.addEventListener('change', function () { chosen = voices[Number(sel.value)] || null; try { localStorage.setItem(VK, chosen ? chosen.name : ''); } catch (e) {} });
  $('test').addEventListener('click', function () { speak('Hello. This is how I sound.'); });
  // Settings are remembered on this phone and sent with every question; the server only accepts known values.
  ['model', 'effort', 'rate', 'detail'].forEach(function (id) {
    var el = $(id); try { var v = localStorage.getItem('voice-set-' + id); if (v !== null) el.value = v; } catch (e) {}
    el.addEventListener('change', function () { try { localStorage.setItem('voice-set-' + id, el.value); } catch (e) {} });
  });
  var lastReply = '';
  $('repeat').addEventListener('click', function () { if (lastReply) speak(lastReply); else say('Nothing to repeat yet.'); });

  function speak(text, then) {
    if (!('speechSynthesis' in window)) { then && then(); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = navigator.language || 'en-US'; u.rate = Number($('rate').value) || 1; if (chosen) { u.voice = chosen; u.lang = chosen.lang; }
    mode('speaking');
    u.onend = function () { mode(''); then && then(); };
    u.onerror = function () { mode(''); then && then(); };
    speechSynthesis.speak(u);
  }

  function listen() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { say('This browser cannot listen. Use Chrome on Android.', 'bad'); return; }
    if (!key) { $('keybox').style.display = 'block'; say('The key is missing.', 'bad'); return; }
    rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true; rec.continuous = false;
    var finalText = '';
    rec.onresult = function (e) { netTries = 0; var t = ''; for (var i = 0; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) finalText = t; } say(t); };
    // Chrome sends speech to Google's servers; on a weak mobile line that fails with "network". Retry quietly a few
    // times instead of stopping hands-free mode (seen on a real phone, 2026-09-26).
    rec.onerror = function (e) {
      mode('');
      if (e.error === 'aborted') { say('Stopped.'); return; }   // you pressed Stop: not an error
      if (e.error === 'no-speech') { say('I did not hear anything.'); if (hands) setTimeout(listen, 400); return; }
      if (e.error === 'network' && netTries < 4) { netTries++; say('Weak connection, trying the microphone again…'); setTimeout(listen, 1500 * netTries); return; }
      say(e.error === 'network' ? 'The speech service cannot be reached on this connection. Tap to try again.' : 'Microphone: ' + e.error, 'bad');
    };
    rec.onend = function () { rec = null; if (finalText.trim()) ask(finalText.trim()); else if (talk.className === 'listening') mode(''); };
    mode('listening'); keepAwake();
    try { rec.start(); } catch (e) { mode(''); say('Could not start the microphone.', 'bad'); }
  }

  function ask(text, newTopic) {
    busy = true; mode('working'); addTurn('You', text); say('Thinking…');
    api('POST', 'ask', { text: text, newTopic: !!newTopic, model: $('model').value, effort: $('effort').value, detail: $('detail').value === '1' }).then(function (j) {
      if (!j.ok) { busy = false; mode(''); say(j.error || 'That did not work.', 'bad'); speak(j.error || 'That did not work.'); return; }
      job = j.jobId; tick = setInterval(beep, 8000); poll();
    }).catch(function () { busy = false; mode(''); say('No connection to the server.', 'bad'); speak('No connection to the server.'); });
  }
  function poll() {
    if (!job) return;
    api('GET', 'job/' + job).then(function (j) {
      if (j.ok && j.status === 'working') { say('Thinking… ' + j.seconds + ' s'); return setTimeout(poll, 2000); }
      clearInterval(tick); tick = null; job = null; busy = false;
      var reply = (j.ok && j.reply) || j.error || 'Something went wrong.';
      addTurn('Claude', reply); say(''); lastReply = reply;
      speak(reply, function () { if (hands) setTimeout(listen, 500); });
    }).catch(function () { setTimeout(poll, 4000); });
  }

  talk.addEventListener('click', function () {
    if (talk.className === 'speaking') { speechSynthesis.cancel(); mode(''); return; }
    if (busy) { say('Still thinking about the last one.'); return; }
    if (rec) { try { rec.stop(); } catch (e) {} return; }
    netTries = 0; listen();
  });
  handsBtn.addEventListener('click', function () { hands = !hands; try { localStorage.setItem('shuteye-hands', hands ? '1' : '0'); } catch (e) {} handsBtn.textContent = 'Hands-free: ' + (hands ? 'on' : 'off'); handsBtn.classList.toggle('on', hands); });
  $('stop').addEventListener('click', function () { try { speechSynthesis.cancel(); } catch (e) {} if (rec) try { rec.abort(); } catch (e) {} if (job) api('POST', 'cancel'); clearInterval(tick); mode(''); say('Stopped.'); });
  $('topic').addEventListener('click', function () { api('POST', 'new-topic').then(function () { log.innerHTML = ''; say('New topic.'); speak('New topic.'); }); });
})();
</script>
</body>
</html>
